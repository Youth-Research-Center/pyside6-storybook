[project]
name = "pyside6-storybook"
version = "0.1.0.dev0"
description = "Storybook-style component explorer for PySide6: browse widgets in isolation, edit their properties live and switch themes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6-Essentials>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyside6_storybook"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = ["B", "Q", "I", "FBT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
qt_api = "pyside6"
