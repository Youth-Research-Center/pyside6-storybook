[project]
name = "pyside6-storybook"
version = "0.1.0.dev0"
description = "Storybook-style component explorer for PySide6: browse widgets in isolation, edit their properties live and switch themes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Youth Research Center" }]
keywords = ["pyside6", "qt", "storybook", "widgets", "gui", "component explorer", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    # PySide6 6.12.0 drops a reference to None, True or False on many calls under Python 3.11, which crashes the interpreter once the
    # count reaches zero. Python 3.12 and newer make those objects immortal, so the leak is harmless there.
    "PySide6-Essentials>=6.8,!=6.12.0; python_version < '3.12'",
    "PySide6-Essentials>=6.8; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/Youth-Research-Center/pyside6-storybook"
Documentation = "https://youth-research-center.github.io/pyside6-storybook/"
Repository = "https://github.com/Youth-Research-Center/pyside6-storybook"
Issues = "https://github.com/Youth-Research-Center/pyside6-storybook/issues"
Changelog = "https://github.com/Youth-Research-Center/pyside6-storybook/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pytest = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
pyside6-storybook = "pyside6_storybook.cli:main"

[project.entry-points.pytest11]
pyside6_storybook = "pyside6_storybook_pytest"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "ty>=0.0.101",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8,<10",
    "mkdocstrings[python]>=1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyside6_storybook", "src/pyside6_storybook_pytest.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "scripts/",
    "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", "mkdocs.yml",
    ".github/workflows/",
]
exclude = ["docs/specs/", "**/__pycache__"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = ["E501", "B", "Q", "I", "FBT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/icons", "scripts/release", "scripts/smoke"]
timeout = 120
qt_api = "pyside6"
addopts = "--strict-markers"
markers = [
    "full: slower end-to-end tests (the installed script in a subprocess, every example in every theme); CI runs them only in the manual Full test suite workflow",
]

[tool.ty.environment]
extra-paths = ["scripts/icons", "scripts/release", "scripts/smoke"]
