[project]
name = "pyside6-storybook"
version = "0.1.0.dev0"
description = "Storybook-style component explorer for PySide6: browse widgets in isolation, edit their properties live and switch themes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # PySide6 6.12.0 drops a reference to None, True or False on many calls under Python 3.11, which crashes the interpreter once the
    # count reaches zero. Python 3.12 and newer make those objects immortal, so the leak is harmless there.
    "PySide6-Essentials>=6.8,!=6.12.0; python_version < '3.12'",
    "PySide6-Essentials>=6.8; python_version >= '3.12'",
]

[project.scripts]
pyside6-storybook = "pyside6_storybook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "ty>=0.0.101",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyside6_storybook"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = ["E501", "B", "Q", "I", "FBT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/icons"]
timeout = 120
qt_api = "pyside6"
addopts = "--strict-markers"
markers = [
    "full: slower end-to-end tests (the installed script in a subprocess, every example in every theme); CI runs them only in the manual Full test suite workflow",
]

[tool.ty.environment]
extra-paths = ["scripts/icons"]
