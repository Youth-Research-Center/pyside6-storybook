name: Tests

# Every push to main and every pull request: lint, type check and the core tests on Linux.
# The slower tests marked `full`, and the Windows, macOS and lowest-version runs, are in full-tests.yml (run it from the Actions tab).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ty check
      - uses: actions/cache@v4
        with:
          path: .icon-cache
          key: icon-cache-${{ hashFiles('src/pyside6_storybook/resources/icons/icon_manifest.toml') }}
      - run: uv run --no-sync python scripts/icons/build_icon_bundle.py --check

  test-core:
    name: core tests (ubuntu-latest, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q -m "not full"
