site_name: pyside6-storybook
site_description: Storybook-style component explorer for PySide6.
site_url: https://youth-research-center.github.io/pyside6-storybook/
repo_url: https://github.com/Youth-Research-Center/pyside6-storybook
repo_name: Youth-Research-Center/pyside6-storybook
strict: true
exclude_docs: |
  specs/

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

not_in_nav: |
  theming.md

nav:
  - Home: index.md
  - Writing stories: writing-stories.md
  - Controls: controls.md
  - Finding stories: finding-stories.md
  - Command line: command-line.md
  - The gallery: gallery.md
  - Themes: themes.md
  - Testing stories: testing.md
  - Troubleshooting: troubleshooting.md
  - Versions and compatibility: versions.md
  - API reference: reference.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
