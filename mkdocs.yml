site_name: pyside6-storybook
site_description: Storybook-style component explorer for PySide6.
site_url: https://youth-research-center.github.io/pyside6-storybook/
repo_url: https://github.com/Youth-Research-Center/pyside6-storybook
repo_name: Youth-Research-Center/pyside6-storybook
strict: true
exclude_docs: |
  specs/

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Theming: theming.md
  - API reference: reference.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
